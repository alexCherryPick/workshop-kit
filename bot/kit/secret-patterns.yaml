# РЕЕСТР ПАТТЕРНОВ СЕКРЕТОВ — читается сканером T4 (bot/secrets.py и hook pre-commit) на каждом
# прогоне; T4 его НЕ ПРАВИТ (владелец — T1). Рубеж ядра 05.3.2 п. 3-4: на находке — запись не
# совершается, ответ в чат называет находку по `name`, подтверждение — новое сообщение с
# префиксом (commands.yaml confirm_prefix). Ставится в .workshop/bot/kit/secret-patterns.yaml.
# Паттерны — Python re; `confidence` — high (сигнатура с фиксированным префиксом) | medium
# (контекстная форма). Множество закрыто правкой реестра, не кода.
# Контракт отчёта о находке (для T4 — сканер и pre-commit): в ответ человеку, в лог прогона и в
# алярм попадают ТОЛЬКО поля report_fields; поля never_report — совпавшее значение и текст
# сообщения — не печатаются никуда и никогда (находка называется по имени, значение не повторяется).
schema_version: 1
registry: secret_patterns
never_report: [matched_value, message_text]
report_fields: [name, describe]
patterns:
  - name: messenger_bot_token
    pattern: "\\b[0-9]{8,10}:[A-Za-z0-9_-]{35}\\b"
    confidence: high
    describe: "токен бота мессенджера (число:35 символов)"
  - name: forge_personal_token
    pattern: "\\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}\\b"
    confidence: high
    describe: "персональный токен форжи (классический)"
  - name: forge_fine_grained_token
    pattern: "\\bgithub_pat_[A-Za-z0-9_]{60,}\\b"
    confidence: high
    describe: "fine-grained токен форжи"
  - name: aws_access_key_id
    pattern: "\\b(AKIA|ASIA)[A-Z0-9]{16}\\b"
    confidence: high
    describe: "идентификатор ключа доступа облака"
  - name: private_key_block
    pattern: "-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY( BLOCK)?-----"
    confidence: high
    describe: "блок приватного ключа"
  - name: slack_token
    pattern: "\\bxox[abpr]-[A-Za-z0-9-]{10,}\\b"
    confidence: high
    describe: "токен рабочего пространства чата"
  - name: jwt
    pattern: "\\beyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\b"
    confidence: medium
    describe: "подписанный веб-токен (три base64url-сегмента)"
  - name: generic_api_key_assignment
    pattern: "(?i)\\b(api[_-]?key|secret|password|passwd|token)\\s*[:=]\\s*['\"]?[A-Za-z0-9_\\-/+=]{16,}"
    confidence: medium
    describe: "присваивание ключа/пароля/токена длинному значению"
