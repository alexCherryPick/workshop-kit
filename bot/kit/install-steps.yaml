# МАШИННЫЙ РЕЕСТР РУЧНЫХ ШАГОВ ЗАКАЗЧИКА — единственный источник (D09 T1, глава §1Д; вердикт В-3).
# N (объявленное число ручных шагов) = число позиций `steps` этого файла; прозой N не называется
# нигде — его печатает прогон (bot/tests/selfcheck_t1.sh, harness/bot_kit_install.sh в T6).
# Читают трое, копий нет: kit/build_help.py (блок шагов инструкции между маркерами), прогон
# установки T6 (счёт и сверка «фактическое ≤ N»), bootstrap-обёртка (шаги, которые она проверяет
# за заказчика — через install.py check-secrets / check-people).
# Поле шага required_secrets (необязательное) — имена секретов из реестра secrets ниже, которые
# кладёт ЭТОТ шаг: install.py check-secrets проверяет присутствие ПО ШАГАМ (альтернатива имени —
# из поля alternative реестра secrets, второй копии имён нет); build_help.py печатает поле в блок.
schema_version: 1
registry: install_steps

# Закрытое множество значений поля шага `when` (D20 T3): метка — то, что печатает build_help.py в блоке шагов
# инструкции (без метки — шаг для всех); secrets_required_when — условие, при котором check-secrets требует
# required_secrets шага (без поля — всегда). Значение when вне множества — отказ build_help и check-secrets.
when_values:
  always: {}
  groups_only:
    label: "только для групповых чатов"
  storage_optional:
    label: "необязательный — только при подключении хранилища вложений"
    secrets_required_when: storage_configured

# Секреты CI заказчика — ровно два ОБЯЗАТЕЛЬНЫХ имени (альтернатива второму — deploy-key) и необязательные секреты
# хранилища вложений (ниже, D20 T3). Имена читает install.py check-secrets; bootstrap.yml привязывает их env-ключами
# (сверка — предикат §2).
# Тип учётных данных второго секрета зависит от владельца репозитория (живой контур, 2026-09-07):
# репозиторий в организации → fine-grained токен системного аккаунта «только выбранные
# репозитории» на ОДИН репозиторий (содержимое: чтение и запись); репозиторий под ЛИЧНЫМ аккаунтом →
# fine-grained токен на чужой репозиторий недоступен, берётся классический токен со scope записи
# в репозитории, а граница «один репозиторий» обеспечивается списком коллабораторов (системный
# аккаунт — коллаборатор ровно одного репозитория); без аккаунта — deploy-key. Имя секрета от
# этого не зависит: либо WORKSHOP_FORGE_TOKEN, либо WORKSHOP_DEPLOY_KEY.
secrets:
  - name: WORKSHOP_TG_BOT_TOKEN
    purpose: "токен бота мессенджера: чтение обновлений и ответы в чат"
    required: true
  - name: WORKSHOP_FORGE_TOKEN
    purpose: "токен СИСТЕМНОГО аккаунта заказчика с правом записи в ОДИН репозиторий И правом на workflow-файлы (fine-grained: Contents: write + Workflows: write — для репозитория организации; классический: scope repo И scope workflow с границей по списку коллабораторов — для репозитория под личным аккаунтом): комплект кладёт обёртки поллера и сторожа в .github/workflows/, без права на workflow push отвергается форжей (живой прогон 2026-09-08) — коммит, push и запуск следующей джобы (вердикт В-4 «4а»)"
    required: true
    alternative: WORKSHOP_DEPLOY_KEY
  - name: WORKSHOP_DEPLOY_KEY
    purpose: "альтернатива WORKSHOP_FORGE_TOKEN: приватный deploy-key репозитория с правом записи (подключён в обёртке наравне с токеном; пустой секрет обёртка игнорирует)"
    required: false
  # Секреты ХРАНИЛИЩА ВЛОЖЕНИЙ (D20 T3) — необязательны: required_when: storage_configured — обязательны, только
  # когда в .workshop/storage.yaml настроена привязка (attach.load_config даёт binding); без хранилища не требуются.
  # storage_credential — какой ключ блока storage.credentials конфига несёт ЭТО имя: install.py storage-init пишет в
  # конфиг имена отсюда (второй копии имён нет), check-secrets сверяет присутствие по ним. Значения — только в секретах
  # CI и в окружении демона (.env.workshop), в git и в конфиг — никогда. Ключ ПИСАТЕЛЯ: put/get/head, без list и delete.
  - name: WORKSHOP_S3_ACCESS_KEY_ID
    purpose: "идентификатор статического ключа ПИСАТЕЛЯ S3-совместимого хранилища вложений (права put/get/head на один бакет, без list и delete)"
    required: false
    required_when: storage_configured
    storage_credential: access_key_id
  - name: WORKSHOP_S3_SECRET_ACCESS_KEY
    purpose: "секрет того же ключа писателя хранилища вложений"
    required: false
    required_when: storage_configured
    storage_credential: secret_access_key

steps:
  - id: bot_token_secret
    title: "Создать бота у BotFather и положить его токен в секрет CI репозитория"
    when: always
    guide: |
      В мессенджере откройте BotFather, создайте бота (команда создания бота) и скопируйте
      выданный токен. В настройках репозитория заказчика создайте секрет с именем из реестра
      секретов комплекта (первое имя) и вставьте токен значением. Privacy-mode у нового бота
      включён по умолчанию — не выключайте его: так бот в группах получает только команды и
      ответы на свои сообщения.
    required_secrets: [WORKSHOP_TG_BOT_TOKEN]
    verified_by: "bootstrap: шаг check-secrets печатает имя секрета как присутствующее; живой прогон Q7 (T6): бот отвечает на команду справки"
  - id: forge_credential_secret
    title: "Выпустить учётные данные системного аккаунта заказчика и положить их во второй секрет"
    when: always
    guide: |
      Заведите системный аккаунт заказчика (ничей, не привязанный к человеку) и дайте ему право
      записи ровно в этот репозиторий. Какой токен выпускать, зависит от того, кому принадлежит
      репозиторий. Репозиторий в организации: fine-grained токен системного аккаунта с выбором
      «только выбранные репозитории» — один этот репозиторий, содержимое: чтение и запись.
      Репозиторий под личным аккаунтом: fine-grained токен на чужой репозиторий выпустить нельзя,
      поэтому берётся классический токен системного аккаунта с ДВУМЯ scope — repo И workflow
      (без workflow форжа отвергает push файлов обёрток в .github/workflows/), а граница «один
      репозиторий» обеспечивается списком коллабораторов — системный аккаунт коллаборатор ровно
      одного репозитория. Для репозитория организации у fine-grained токена нужны Contents: write
      и Workflows: write. Положите токен во второй секрет из реестра секретов
      комплекта. Альтернатива без аккаунта — deploy-key с правом записи в третий секрет из
      реестра; секрет всё равно один: либо токен, либо deploy-key, обёртка подключает оба и
      пустой игнорирует.
    required_secrets: [WORKSHOP_FORGE_TOKEN]
    verified_by: "bootstrap: push коммита установки проходит под этим секретом (токен либо deploy-key); отрицательный контроль T6 — штатный токен CI следующую джобу не запускает"
  - id: people_map
    title: "Положить карту людей .workshop/people.yaml из шаблона комплекта и вписать себя"
    when: always
    guide: |
      Скопируйте шаблон карты людей из комплекта в файл карты людей вашего репозитория и
      замените примеры своими записями: handle, имя, часовой пояс в форме IANA, свой telegram_id
      (бот подскажет его в ответе на первое сообщение) и запись бота из шаблона. Хотя бы одну
      запись отметьте ролью админа с telegram_id — админам приходят сообщения сторожа (тревога,
      зависший учёт, счётчик отклонений). Закоммитьте и запушьте. Комплект этот файл никогда не
      создаёт и не перезаписывает: это ваши данные, а не его.
    verified_by: "bootstrap: шаг check-people — файл существует, разбирается строгим загрузчиком, содержит handle бота и хотя бы одного админа с telegram_id; иначе падение с названной причиной"
  - id: launch_form
    title: "Выбрать форму запуска поллера в настройках комплекта: обёртки CI (по умолчанию) или демон"
    when: always
    guide: |
      В настройках комплекта (файл настроек бота в каталоге .workshop) есть поле launch с двумя
      значениями: ci и daemon. По умолчанию — ci, обёртки CI: workflow-файлы поллера и сторожа кладёт
      сам комплект, ничего делать не нужно (отсутствие поля означает то же). Если бот у вас работает
      демоном (контейнер комплекта на вашем хосте), впишите launch: daemon ДО первого запуска
      bootstrap-обёртки: тогда комплект обёртки не кладёт, а уже лежащие удаляет тем же
      установочным коммитом. При обновлении комплекта строку сохраняйте — bootstrap раскладывает
      по ней при каждом запуске. Обратный переход на ci — сначала остановить демон руками, потом
      менять значение: иначе курсор обновлений будут читать двое.
    verified_by: "bootstrap: шаг layout печатает форму запуска и реестр управляемых обёрток; при демоне после установки в каталоге workflow-файлов нет обёрток поллера и сторожа; check-people отказывает, если при демоне управляемая обёртка всё же лежит (harness/bot_kit_install.sh, сценарий заказчика-демона)"
  - id: customer_layer
    title: "Положить слой заказчика .workshop-ai/customer-layer.yaml для инструкций ИИ-агента"
    when: always
    guide: |
      Инструкции ИИ-агента (профили и постоянная инструкция) называют ваш репозиторий, бота, мессенджер, хостинг и
      команды — эти значения живут в вашем репозитории, а не в комплекте. Скопируйте образец слоя из комплекта
      (bot/kit/ai/customer-layer.example.yaml в checkout комплекта; после первой установки он лежит и в каталоге
      .workshop-ai) в файл .workshop-ai/customer-layer.yaml, впишите свои значения (без имён людей), закоммитьте и
      запушьте. Инструкции под этот слой собирает и проверяет поставщик комплекта: он выпускает релиз комплекта для
      вашего репозитория (тот же код комплекта, инструкции под ваш слой) и даёт клиентскую копию bootstrap-обёртки
      с его ref. Установка сверяет слой с манифестом комплекта и без слоя или с другим слоем останавливается, назвав
      файл, — ничего не записав; после правки слоя нужен новый релиз под него.
    verified_by: "install.py layout: привязка манифеста customer_layer сверяется со слоем клона до мутаций — нет слоя или он другой — именованный отказ; harness/bot_kit_install.sh, раздел 8 (без слоя rc 2, чужой слой rc 2, со слоем — раскладка); bot/tests/test_install_ai.py (пакет мутаций байт слоя); релиз под слой — scripts/mirror_kit.sh --customer-layer (батарея под слоем rc 0, check-kit-ref на релизе)"
  - id: copy_bootstrap_workflow
    title: "Скопировать один файл kit/workflows/bootstrap.yml в каталог workflow-файлов репозитория и запушить"
    when: always
    guide: |
      Скопируйте единственный файл комплекта, который ставится руками, — bootstrap-обёртку — в
      каталог workflow-файлов вашего репозитория и запушьте. Дальше всё делает workflow: скачивает
      пиннованный комплект и валидатор, сверяет пин комплекта и контрольную сумму, раскладывает
      файлы, ставит хук, проверяет карту людей, коммитит и пушит установку, ставит обёртки
      поллера и сторожа. Тем же шагом кладутся инструкции ИИ-агента: профили в каталоге .workshop-ai
      и постоянная инструкция в двух одинаковых файлах корня (AGENTS.md и CLAUDE.md); устаревшие
      файлы инструкций (в том числе прежний каталог .workshop/ai) снимаются по контрольной сумме,
      в .gitignore дописывается строка личного
      файла агента .workshop/me.yaml. Если вы правили такой файл руками, установка остановится и
      назовёт конфликт — путь, ожидаемую и фактическую сумму — ничего не записав: перенесите свои
      правки в собственный файл, верните или удалите названный файл и запустите bootstrap снова.
    verified_by: "прогон bootstrap присутствует в журнале CI и завершён успешно; harness/bot_kit_install.sh (T6) считает шаги и сверяет с N; install.py layout отказывает, если обёртка комплекта несёт незаполненный пин (комплект обязан быть выпущен релизом канала выдачи); инструкции ИИ-агента — harness/bot_kit_install.sh, раздел 8: раскладка на чистом клоне, AGENTS.md == CLAUDE.md, повтор без изменений, retire по контрольной сумме с диффом, локальная правка — именованный конфликт, незаполненный плейсхолдер — отказ, строка .workshop/me.yaml в .gitignore"
  - id: storage_binding
    title: "Необязательно: подключить хранилище вложений (S3-совместимое) для файлов выше порога git"
    when: storage_optional
    guide: |
      Шаг нужен, только если вложения крупнее порога git должны сохраняться: без него файл до порога
      ложится в git, а выше — получает пометку «не сохранено — хранилище не настроено», и бот отвечает
      отправителю. Заведите у своего провайдера (AWS S3, Yandex Object Storage, Cloudflare R2, MinIO)
      ПРИВАТНЫЙ бакет: без анонимного чтения и листинга, без версионирования (изъятие обязано удалять
      байты, а не прятать их за версией). Выпустите ключ ПИСАТЕЛЯ только с правами на загрузку, чтение
      и проверку объекта (put, get, head) в этом бакете — без list и без delete; удаление при изъятии —
      отдельный ключ, его держит человек, не бот. Значения ключа положите только в секреты CI
      репозитория (имена — секреты хранилища из реестра комплекта) и в окружение демона, если бот у вас
      демоном; в git, в файлы конфига и в чат — никогда. Затем в файле .workshop/storage.yaml
      раскомментируйте блок storage, впишите эндпоинт, регион и бакет и запустите install.py
      storage-init: он допишет имена секретов, создаст ОДИН раз случайный префикс ключей (секрет конфига:
      не печатается и дальше не меняется — сменить его можно только процедурой смены хранилища) и
      объект-канарейку, затем напечатает статус пробы. Закоммитьте файл. install.py storage-status
      повторяет пробу в любой момент. Подробная инструкция (выбор провайдера, бакет, ключи, проверка,
      изъятие) — .workshop/bot/kit/docs/storage-setup.ru.md.
    required_secrets: [WORKSHOP_S3_ACCESS_KEY_ID, WORKSHOP_S3_SECRET_ACCESS_KEY]
    verified_by: "install.py storage-init / storage-status печатают storage_probe_outcome ok (канарейка читается ключом писателя); check-secrets при настроенном хранилище требует секреты хранилища, без него — не требует; bot/tests/test_storage_config.py (фейк S3 в трёх режимах провайдера)"
  - id: group_membership
    title: "Для групповых чатов: добавить бота в группу (privacy-mode оставить включённым)"
    when: groups_only
    guide: |
      Если время будут писать из группового чата, добавьте бота в группу. Privacy-mode оставьте
      включённым: в группе бот получает команды со своим именем (`/summary@имя_бота team`) и ответы
      (reply) на свои сообщения, а часы всегда пишутся отправителю сообщения — по карте людей, никогда по
      чату. Команду без имени бота Telegram передаёт, только если бот писал в группе последним
      (с другими ботами в группе — почти никогда), поэтому в группе пишите команду с именем.
      Свободный текст с часами пишите боту в личку или ответом (reply) на его сообщение — фраза
      с `@бот` в группе до бота не дойдёт.
    verified_by: "живой прогон Q7 (T6): неадресованная реплика в группе до бота не доходит, адресованная команда — доходит; свободный текст с `@бот` — не доходит; reply на сообщение бота — доходит"
