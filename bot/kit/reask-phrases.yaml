# ФРАЗЫ ПЕРЕСПРОСА — ОТДЕЛЬНЫЙ реестр комплекта [ЭРРАТА D10 «А» 2026-09-24; контракт §1А(б), §1 №исход-4 и
# №исход-23; R3-fix, Q-01: вынесен из commands.yaml, чтобы ни один байт фраз не влиял на разбор грамматики и приём].
# ЗАКРЫТОЕ отображение «имя причины → человеческая фраза» по исходу — что не так и как написать. Человек видит
# ТОЛЬКО фразу (плюс токен справки); машинное имя причины пишется в трассу поллера, не в ответ.
# Множество имён по каждому исходу РАВНО множеству причин, которые порождает код разбора/отзыва (все модули
# bot/*.py): лишнее имя, имя кода без фразы, подменённое имя, пустая/порченая фраза, а также файл, который не
# читается (нет, не обычный файл — FIFO/устройство/каталог, в т.ч. цель ссылки, больше 256 КиБ, пуст, дубль ключа,
# плохой escape, незакрытая кавычка, не тот registry) — ОТКАЗ ПРОГОНА СПРАВКИ:
# продуктовый валидатор build_help.check_reask проверяет таблицу ЦЕЛИКОМ до любой справки (rc 3, имя нарушения;
# rc 4 — сборщик не разрешил форму кода); множество имён кода он собирает из самого кода (AST), второго списка нет.
# Поллер читает этот файл ОТДЕЛЬНО от реестра команд (build_help.load_phrases, ошибки — в нарушения, не в
# исключения): при порче приём часов идёт, справка отказывает, переспрос — проверенными фразами, иначе заглушкой
# (порчена и она — встроенный резерв кода), алярм с именем нарушения — раз за прогон, каждый прогон, пока дефект
# не исправлен (решение alex 2026-09-26: без троттлинга). Независимый оракул —
# bot/tests/test_reask_reasons.py (гейт G16). Причина с хвостом после «:» (`unknown_command:<токен>`) ищется по
# имени до двоеточия. Добавление причины в код = фраза здесь.
# Подстановки — только из реестров, литералов команд и примеров во фразах нет: {token:<id>}, {example:<id>},
# {example_dated:<id>} — поля позиции реестра команд kit/commands.yaml; {form:<id>} — пример формы реестра
# kit/duration-forms.yaml. Бюджет: ответ «<фраза>. <указатель справки>» ≤ 160 символов.
schema_version: 1
registry: reask_phrases

reask_reasons:
  reask_unparsed:
    free_text_without_time: "не нашёл длительность: напишите «{form:decimal_hours_word}», за прошлый день — с датой первой: «{form:dated_decimal_hours}»"
    duration_ambiguous: "не понял, какая длительность: нужна одна — в начале строки, например «{form:units_short_leading}»"
    date_not_calendar: "такой даты нет в календаре: дата — ГГГГ-ММ-ДД первой, например «{form:dated_decimal_hours}»"
    track_without_interval: "у {token:track} нужен интервал ЧЧ:ММ-ЧЧ:ММ (дата — первой, если не сегодня): {example_dated:track}"
    n_not_positive_integer: "номер — целое число от 1; номера заголовков показывает {token:last}"
    n_out_of_range: "такого номера нет в вашем списке заголовков — свежий список покажет {token:last}"
    last_list_unavailable: "список заголовков недоступен — запросите его заново: {token:last}"
    unknown_command: "такой команды у бота нет"
    confirm_without_message: "после {token:confirm} пришлите исходное сообщение целиком"
    confirm_not_allowed: "здесь нечего подтверждать — пришлите команду без {token:confirm}"
    no_free_text_position: "свободный текст бот не принимает — только команды"
    not_utf8: "сообщение не читается как текст — пришлите его заново"
    title_empty: "нужен заголовок, например: {example:start_title}"
    stop_time_not_clock: "время конца — ЧЧ:ММ от 00:00 до 24:00, например {example:stop}; коммент, начинающийся с цифр, начните словом"
    nonexistent_local_time: "такого местного времени в этот день не было (перевод часов) — укажите другое время"
    callback_time_bearing: "кнопка лишь подставляет команду — отправьте её сообщением: время берётся из сообщения"
    callback_not_allowed: "эта команда кнопкой не исполняется — отправьте её сообщением"
    summary_multiline: "у {token:summary} только одна строка: [team] [N|all], например {example:summary}"
    summary_extra_arguments: "у {token:summary} лишние слова: допустимо [team] [N|all], например {example:summary}"
    summary_bad_argument: "период {token:summary} — целое N от 1 или all, например {example:summary}"
    summary_period_out_of_range: "такой период {token:summary} выходит за пределы календаря — укажите меньшее N"
  reask_undo_not_found:
    no_line: "нечего отзывать: действующих ваших строк нет"
    n_out_of_range: "нечего отзывать: такого номера нет в списке — свежий список покажет {token:last}"
    target_unanchored: "нечего отзывать: у этой строки нет якоря, командой её не отозвать — поправьте в приложении"
    target_changed: "строка изменилась, пока шёл отзыв — посмотрите {token:last} и повторите"
# Заглушка — АВАРИЙНОЕ поведение с явным сигналом, не замена фразы: проверяется тем же валидатором (одна строка,
# без машинного имени, в бюджете). Отсутствие фразы ИЗВЕСТНОЙ причины заглушкой не закрывается — это отказ прогона
# справки. Поллер (Q-01, решение alex 2026-09-26) при порченом узле НЕ останавливается: приём часов идёт, справка
# отказывает, переспрос — проверенными фразами, иначе этой заглушкой (порчена и она — встроенный резерв кода), алярм
# с именем нарушения — раз за прогон, пометка «заглушка» — в трассе.
reask_reason_fallback: "не понял сообщение"
