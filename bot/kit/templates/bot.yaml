# НАСТРОЙКИ КОМПЛЕКТА БОТА — шаблон; ставится в .workshop/bot.yaml ОДИН РАЗ (роль config:
# создаётся, если нет; при обновлении комплекта не перезаписывается — это настройки заказчика).
# Все числа-политики бота живут ЗДЕСЬ, а не в коде и не в workflow-обёртках (предикат §2).
schema_version: 1

# handle бота в карте людей: author конверта контейнеров, которые бот создаёт лениво (§7);
# отсутствие в карте → W-AUTHOR-UNKNOWN (проверка install.py check-people).
bot_handle: workshop_bot

# Самозапись незнакомого отправителя (П-8, REQ-090 v7): on — заводится pending с handle tg-<id>,
# часы пишутся сразу; off — коммита нет, ответ «нет в карте», счётчик отклонений (исход 7).
self_registration: on

# timezone для pending-записей самозаписи (IANA).
default_timezone: UTC

# Сторож (вердикт В-5; T5 dead-man alarm): пороги — настройки, числа печатает прогон.
watchdog:
  # окно хранения getUpdates мессенджером (часы, D04 §9 ~24 ч) — ВЕРХНЯЯ граница порога молчания;
  # проверка комплекта: unprocessed_update_alarm_hours < retention_window_hours (install.py check-people).
  retention_window_hours: 24
  # порог МОЛЧАНИЯ: возраст самого старого НЕОБРАБОТАННОГО update, после которого — алярм (часы).
  unprocessed_update_alarm_hours: 20
  # порог ЗАВИСШЕЙ СЕССИИ — ОТДЕЛЬНАЯ настройка, НЕ равная порогу молчания [АМЕНДМЕНТ T5 по плану
  # REQ-089 v3, 2026-09-07: у молчания и зависшей сессии разные предметы и разные естественные
  # величины — молчание меряется окном retention мессенджера, сессия рабочим днём человека; поэтому
  # производная equals_… из билда T1 заменена явной настройкой]. Открытая дольше — исход 18.
  stale_session_alarm_hours: 12
  # повтор уведомления о ТОЙ ЖЕ висящей сессии — не чаще раза в столько часов (иначе сторож учит
  # игнорировать себя); правило редкого повтора, состояние — .workshop/bot-heartbeat.yaml.
  stale_session_repeat_hours: 24
  # порог всплытия счётчика отклонений (REQ-090): >= столько отклонений с прошлого отчёта — назвать
  # число сообщений и число отправителей; меньше — молчать (0 отключил бы порог — молчания не будет).
  rejection_report_min: 1
  # Адресаты алярма молчания и отчёта отклонений: admins — все записи карты людей с role: admin
  # и telegram_id (install.py check-people требует хотя бы одну); либо целое — chat_id напрямую.
  # Уведомление о зависшей сессии идёт В ЧАТ ТОГО ЧЕЛОВЕКА (chat_id записи), не админам.
  alarm_to: admins

# Ретраи push (семантика — D04 §2.3, механика — T3): суммарное время ретраев ОБЯЗАНО быть
# заведомо меньше окна retention (D04 §9).
retry:
  push_max_attempts: 5
  push_backoff_seconds: 20

# команда списка последних заголовков без аргумента показывает столько позиций.
last_default_n: 5

# Транспорт (tg.py — политики не несёт; значения подаёт вызывающий отсюда).
transport:
  http_timeout_seconds: 30
  long_poll_seconds: 0
