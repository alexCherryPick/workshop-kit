# ХРАНИЛИЩЕ ВЛОЖЕНИЙ — конфиг заказчика (D20 T3; норма вложений 04 §9.8, attachments.yaml storage_binding).
# Ставится комплектом ОДИН РАЗ (роль config): создаётся, если файла нет; при обновлении комплекта НЕ перезаписывается —
# это настройки заказчика. Читают его адаптер вложений (бот, CLI, фронты — attach.load_config) и установщик
# (install.py storage-init / storage-status). Ключи файла — только факты привязки; лишний ключ — отказ с причиной.
#
# Без блока storage хранилище НЕ настроено, и это законный режим: файл до порога ложится в git, выше — указатель
# «не сохранено» (unsaved, причина no-storage) и ответ отправителю. Порог git — git_threshold_bytes: целое число
# байт >= 0; без строки действует порог нормы. Держите его не выше жёсткого предела файла у хостинга git.
#
# Подключение S3-совместимого хранилища (ручной шаг storage_binding реестра комплекта): раскомментируйте блок,
# впишите эндпоинт (https://, без пути), регион провайдера и имя приватного бакета, затем запустите
# install.py storage-init. Он сам допишет в блок:
#   credentials — ИМЕНА переменных окружения с ключом писателя (из реестра секретов комплекта), не значения;
#   key_prefix  — случайный префикс ключей объектов: секрет конфига, создаётся ОДИН раз, не печатается и дальше
#                 не меняется (сменить — только процедурой смены хранилища: скопировать объекты, сверить, сменить);
#   canary_key  — имя объекта-канарейки под префиксом: по нему проба проверяет ключ писателя.
# Значения ключей доступа сюда не пишутся НИКОГДА — только в секреты CI и в окружение демона.
# Необязательные факты: addressing (path | virtual; умолчание path), list_permission (true, если у ключа есть
# ListBucket; умолчание false), timeout_s и deadline_s (целые секунды > 0).
#
# storage:
#   endpoint: https://storage.example.invalid
#   region: example-region-1
#   bucket: example-workshop-attachments
#   addressing: path
