# Не форма записи ядра; ВЫВЕДЕН из слияния строкой `-merge` шаблона gitattributes (`git check-attr merge -- .workshop/bot-sessions.yaml` = unset):
# двусторонняя чужая правка = конфликт (громкий отказ), односторонняя — перечитывается поллером (T3 §0Б).
# Конфликт слияния именно этого файла — громкий отказ, автоматического разрешения нет (§1Б(г)).
#
# Схема (D09 T1 §1Б(б); машиночитаемый дубль — tg-bot.yaml session_record_schema):
#   sessions: мэппинг <handle человека из карты людей> → запись; одна запись на человека;
#   запись «учёт открыт» существует ⟺ есть ключ; «учёт закрыт» ⟺ ключа нет.
#   Поля записи (все обязательны):
#     title            ← заголовок из сообщения открытия (первая строка) или из списка по номеру
#     start_text       ← ПОЛНЫЕ байты текста сообщения открытия (для коммента при закрытии)
#     started_at       ← message.date сообщения открытия, ЦЕЛЫЕ секунды эпохи
#     started_at_local ← то же время строкой ISO-8601 со смещением, в timezone человека
#     chat_id          ← чат, куда отвечать при закрытии
#     start_update_id  ← update_id сообщения открытия (трасса и переспрос)
#     start_message_id ← message_id сообщения открытия (с chat_id — identity носителя открытия для id коммента; амендмент T1 по hard dep T2)
#     schema_version   ← версия схемы комплекта (путь обновления REQ-084)
#   Пример записи (иллюстрация формы; в шаблоне записей нет; <handle> — из карты людей):
#     <handle>:
#       title: созвон с подрядчиком по стенду
#       start_text: "<полные байты сообщения открытия, включая командный токен и хвост>"
#       started_at: 1788790990
#       started_at_local: "2026-09-07T14:03:10+02:00"
#       chat_id: 100000001
#       start_update_id: 900000123
#       start_message_id: 4123
#       schema_version: 1
sessions: {}
