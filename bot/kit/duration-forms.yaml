# РЕЕСТР ФОРМ ДЛИТЕЛЬНОСТИ свободной строки и маркеров исправления (D09 T8; REQ-094, REQ-093 исход 6).
# Единственный источник: парсер (T2/T8) читает ЕДИНИЦЫ, ЧИСЛО и ПОЗИЦИИ отсюда на каждом прогоне и
# списка форм в коде не держит; генератор справки печатает ПРИМЕРЫ отсюда; оракул (тесты, G15)
# берёт отсюда ТОЛЬКО пары «пример → expected_seconds» (golden) и regex не читает — правило
# сходимости §2: у оракула и писателя нет общего хелпера, а реестр с ожиданиями им общий не является.
# Добавление формы = правка ЭТОГО файла (единица/пример/golden) + перегенерация, не правка кода.
schema_version: 1
registry: duration_forms

# Позиции длительности в первой строке сообщения (после необязательной явной даты).
# ПРИОРИТЕТ (T8 §б): ведущая найдена → конец строки НЕ сканируется («1ч пробежка 400м» = 1 ч,
# заголовок «пробежка 400м»); конечная — только при отсутствии ведущей («проба 1ч»). Середина
# строки не сканируется никогда. Две НЕсоседние единицы без ведущей («созвон 30м … 1ч») —
# неоднозначность: переспрос с причиной duration_ambiguous, не выбор.
positions: [leading, trailing]

# Число: до трёх цифр; десятичные часы через точку или запятую («1.5 часа», «1,5ч», «0.25h»).
# Десятичная дробь допустима только у часов; у минут — целое.
number_pattern: '\d{1,3}(?:[.,]\d{1,2})?'

# Единицы: токен сравнивается без учёта регистра; после числа — пробел не обязателен («1ч», «1 ч»,
# «1час»); точка после единицы допустима («1 ч.»). Падежи и формы — здесь, не в коде.
units:
  hours:
    seconds: 3600
    tokens: [ч, час, часа, часов, h, hr, hrs, hour, hours]
  minutes:
    seconds: 60
    tokens: [м, мин, минута, минуты, минут, m, min, mins, minute, minutes]

# ЧЧ:ММ — отдельная форма (часы 0–999, минуты 00–59), ТОЛЬКО ведущая: в конце строки «12:30» —
# время суток («обед 12:30»), не длительность [раунд 1 адверсария, №10].
hhmm_pattern: '\d{1,3}:[0-5]\d'
hhmm_positions: [leading]

# Составная длительность — СОСЕДНИЕ единицы в УБЫВАЮЩЕМ порядке (часы, затем минуты, каждая не более
# одного раза), разделитель — пробелы/запятая или ничего («2 часа 30 минут», «1.5ч 30м», «2h40m»,
# «1 hour 15 min»): секунды складываются. Обратный порядок («40м 2ч»), повтор единицы («1ч 2ч …») или ещё одна
# длительность вплотную к ведущей — НЕОДНОЗНАЧНОСТЬ (duration_ambiguous), не заголовок [раунд 1, №11;
# гл. 01 §1]. Ведущая ЧЧ:ММ при единичной длительности дальше в строке («15:00 созвон 1ч») — тоже
# неоднозначность: ЧЧ:ММ здесь скорее время суток [раунд 3].
compound_separator: '[ ,]*'
compound_order: [hours, minutes]

# Конечная форма НЕ берётся, если перед ней стоит предлог/маркер момента или количества: «созвон в 15:00»,
# «убрать валидацию 24 ч»? — нет: «… до 00:00», «… в 15:00», «… на 3 часа» — момент или количество, а не
# длительность работы [раунд 1, №10]. Сравнение без учёта регистра, токен целиком.
trailing_excluded_preceding_tokens: [в, до, с, к, на, за, около, через, at, by, till, until, to, for, from, in, about]

# ФОРМЫ — документация и golden: пример разбирается ЦЕЛИКОМ как свободная строка, ожидаемые
# секунды и заголовок печатаются прогоном и сверяются оракулом. Все прежние формы T2 сохранены.
forms:
  - id: hhmm_leading
    example: "1:20 созвон"
    expected_seconds: 4800
    expected_title: "созвон"
  - id: units_short_leading
    example: "2ч 40м созвон по релизу"
    expected_seconds: 9600
    expected_title: "созвон по релизу"
  - id: hours_short_only
    example: "1ч проба"
    expected_seconds: 3600
    expected_title: "проба"
  - id: minutes_short_only
    example: "45м ревью"
    expected_seconds: 2700
    expected_title: "ревью"
  - id: latin_units_leading
    example: "1h 30m sync"
    expected_seconds: 5400
    expected_title: "sync"
  - id: hours_word_leading
    example: "1 час проба"
    expected_seconds: 3600
    expected_title: "проба"
  - id: hours_word_plural
    example: "2 часа созвон"
    expected_seconds: 7200
    expected_title: "созвон"
  - id: minutes_word_leading
    example: "30 минут разбор"
    expected_seconds: 1800
    expected_title: "разбор"
  - id: compound_words
    example: "2 часа 30 минут ревью"
    expected_seconds: 9000
    expected_title: "ревью"
  - id: decimal_hours_word
    example: "1.5 часа тесты"
    expected_seconds: 5400
    expected_title: "тесты"
  - id: decimal_comma_short
    example: "1,5ч тесты"
    expected_seconds: 5400
    expected_title: "тесты"
  - id: decimal_latin
    example: "0.25h чек стенда"
    expected_seconds: 900
    expected_title: "чек стенда"
  - id: english_words_compound
    example: "1 hour 15 min planning"
    expected_seconds: 4500
    expected_title: "planning"
  - id: trailing_short
    example: "проба 1ч"
    expected_seconds: 3600
    expected_title: "проба"
  - id: trailing_words
    example: "созвон с юристами 1 час 20 минут"
    expected_seconds: 4800
    expected_title: "созвон с юристами"
  - id: trailing_units_after_number_title
    example: "релиз v2 45м"
    expected_seconds: 2700
    expected_title: "релиз v2"
  - id: leading_with_correction_word_in_title
    example: "1ч исправление багов"
    expected_seconds: 3600
    expected_title: "исправление багов"
  - id: leading_with_error_word_in_title
    example: "2ч Ошибка с рефандом на прод"
    expected_seconds: 7200
    expected_title: "Ошибка с рефандом на прод"
  - id: leading_wins_over_trailing
    example: "1ч пробежка 400м"
    expected_seconds: 3600
    expected_title: "пробежка 400м"
  - id: time_of_day_in_middle_is_not_duration
    example: "созвон в 15:00 1ч"
    expected_seconds: 3600
    expected_title: "созвон в 15:00"
  - id: hours_unit_with_dot
    example: "1 ч. созвон"
    expected_seconds: 3600
    expected_title: "созвон"

# ОТРИЦАТЕЛЬНЫЙ КОРПУС — что НЕ есть длительность (переспрос с названной причиной).
negative:
  - example: "1ч 2ч созвон"          # повтор единицы сразу после ведущей — не «1ч + заголовок 2ч созвон»
    reason: duration_ambiguous
  - example: "2ч 40м 10 min проба"   # третья длительность вплотную к составной — неоднозначность, не заголовок
    reason: duration_ambiguous
  - example: "15:00 созвон 1ч"        # ведущая ЧЧ:ММ при единичной длительности дальше — время суток, неоднозначность [раунд 3]
    reason: duration_ambiguous
  - example: "15:00 созвон (1ч)"      # то же при единице в скобках — границы проверки неоднозначности широкие [раунд 4]
    reason: duration_ambiguous
  - example: "созвон через 2ч"   # NBSP (U+00A0) перед предлогом — тот же предлог, тот же запрет [раунд 7]
    reason: free_text_without_time
  - example: "созвон	через 30 min"   # TAB перед предлогом
    reason: free_text_without_time
  - example: "созвон 30м с юристами 1ч"
    reason: duration_ambiguous
  - example: "обед 12:30"
    reason: free_text_without_time
  - example: "созвон в 15:00"
    reason: free_text_without_time
  - example: "убрать валидацию до 00:00"
    reason: free_text_without_time
  - example: "отображается с разницей в 3 часа"
    reason: free_text_without_time
  - example: "созвон без времени"
    reason: free_text_without_time
  - example: "исправление багов"
    reason: free_text_without_time
  - example: "Ошибка с рефандом на прод"
    reason: free_text_without_time
  - example: "часа два созвон"
    reason: free_text_without_time
  - example: "1 созвон"
    reason: free_text_without_time

# МАРКЕРЫ ИСПРАВЛЕНИЯ (И5, D04 гл. 05 §4.6; контракт исход 6 получает продюсера). ФОРМА, не словарь
# [раунд 1 адверсария №1 и раунд 2 W1: стемы «исправ/поправ/вместо» — обычная лексика заголовков работ, 110 из
# 3 181 живых заголовков в ведущей форме и 82 — в конечной]. Исход reask_correction наступает ТОЛЬКО когда в
# первой строке (i) НЕТ ведущей длительности (правильная строка «<длительность> <заголовок>» — всегда
# запись, чем бы заголовок ни был) И (ii) в строке есть хотя бы одна длительность И (iii) найдена ФОРМА
# исправления: либо СТРУКТУРНЫЙ маркер сравнения КОЛИЧЕСТВ (correction_markers: «не <число> [,] а <число>»,
# «<число> [,] а не <число>», «not <число> [,] but <число>» — запятая необязательна; сравнение предметов
# «не кнопку, а ссылку» маркером не является [раунд 3]),
# либо СЛАБЫЙ маркер-стем (correction_markers_weak) вместе с признаком замены — длительностей в строке две и
# больше («вместо 2ч — 1ч») или длительность стоит после предлога цели (correction_target_prepositions:
# «исправь созвон НА 2ч»). Слабый маркер с одной длительностью без предлога цели — обычная запись в конечной
# форме («исправил стили 2ч»). Регулярные выражения без учёта регистра.
# {Q} — операнд-количество: число (number_pattern) ЦЕЛОЙ лексемой (перед ним не цифра/буква/разделитель дроби, после
# него не буква, не цифра, не продолжение дроби) с необязательной единицей (units); подставляется парсером
# [раунд 4 W2, раунд 5 W2: «не 3D кнопку, а 2D ссылку 2ч», «не 3 кнопку, а 20D ссылку 2ч» — предметы → запись].
correction_markers:
  - '(^|\s)не\s+{Q}(?:\s+\S+){0,3}?\s*,?\s*а\s+{Q}'
  - '(^|\s){Q}(?:\s+\S+){0,3}?\s*,?\s*а\s+не\s+{Q}'
  - '(^|\s)not\s+{Q}(?:\s+\S+){0,3}?\s*,?\s*but\s+{Q}'
correction_markers_weak:
  - '(^|\s)вместо(\s|$)'
  - '(^|\s)исправ'
  - '(^|\s)поправ'
  - '(^|\s)instead(\s|$)'
  - '(^|\s)correct(ion)?(\s|$)'
correction_target_prepositions: [на, to]
correction_examples:
  - "не 3.25, а 1.25 часа"
  - "вместо 2ч — 1ч"
  - "исправь вчерашний созвон на 2ч"
  - "not 3h but 1h"
  - "поправь: не 2ч а 3ч"
  - "созвон был 1ч, а не 2ч"
  - "correct yesterday's call to 1h"
  - "не 3.25 а 1.25 часа"
  - "not 3h, but 1h"
  - "созвон 2 часа а не 3 часа"
correction_negative_examples:
  - "исправил стили 2ч"
  - "поправить по комментам 45м"
  - "поправка 1ч 20м"
  - "вместо созвона переписка 30м"
  - "123 - Клубы: создание 1. Исправил необязательные поля 2ч"
  - "233 - Динамическая ценовая политика корта 1. Исправил баги 2ч"
  - "исправление багов 2ч"
  - "поправил тесты 30 мин"
  - "correction of invoices 1h"
  - "разбор отчёта, исправил цифры 1 час"
  - "instead of call — chat 30m"
  - "выводить имя, а не id 2ч"
  - "не кнопку, а ссылку 2ч"
  - "not a button but a link 1h"
  - "созвон, а не письмо 45м"
  - "не 3D кнопку, а 2D ссылку 2ч"
  - "не v2, а v3 экран 1ч"
  - "not 3D but 2D layout 1h"
  - "не 3 кнопку, а 20D ссылку 2ч"
  - "не 3 кнопку, а 2.0D ссылку 2ч"
  - "not 3 but 20D layout 1h"
  - "1ч не забыл про созвон"
  - "2ч 40м созвон, не успели всё"
  - "1ч исправление багов"
  - "45м поправить по комментам в ПР"
  - "2ч Ошибка с рефандом на прод"
  - "1ч багфикс - исправил эп отклонения заявки"
  - "30м вместо созвона — переписка"
  - "1ч 15м поправка инвалидации кэша в городах"
  - "2ч исправить отображение расписания"
  - "1ч ревью: исправления по комментам"
