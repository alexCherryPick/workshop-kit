# МАНИФЕСТ РЕЛИЗНОГО БИНАРЯ ВАЛИДАТОРА — «версия → путь/URL → sha256 → назначение» (D09 T1 §1Д(б),
# вердикт В-3). Режим применения — СВЕРКА: install.py validator скачивает артефакт пиннованной
# версии и сравнивает sha256 с этим файлом; несовпадение — громкий отказ с названной причиной,
# никогда «продолжим без валидатора». Значение sha256, не являющееся 64 hex-символами
# (плейсхолдер ниже), при сверке ПАДАЕТ, а не проходит: сверять не с чем.
# Фактические sha256 заполняет первый релиз (T6 / релизный канал); до него комплект ставится
# только с локальным бинарём (install.py validator --path <бинарь> для прогонов).
# Блок kit — ПИН КОМПЛЕКТА: репозиторий канала выдачи и полный SHA коммита комплекта, который
# bootstrap.yml извлекает (with.repository / with.ref обязаны совпадать — сверяет install.py
# check-kit-ref по HEAD checkout'а комплекта). До релиза ref — плейсхолдер НЕ в форме SHA:
# предикат §2 печатает его как незаполненный пин, check-kit-ref его ОТКАЗЫВАЕТ («пин не
# заполнен»), а не принимает; заполнить его печатью нулей нельзя — нулевой дайджест/SHA есть
# отдельный отказ. Скачивание артефакта — только https://, небезопасный редирект — отказ.
