# РЕЕСТР СНИМАЕМЫХ И ЗАМЕНЯЕМЫХ ФАЙЛОВ ЗАКАЗЧИКА — вход build_manifest.py (проекция в kit/manifest.yaml: retire,
# supersedes). Владелец — T3 D10. У заказчика не ставится (инструмент сборки манифеста).
# SHA retire с origin: customer_live и все supersedes сняты с живого репозитория заказчика (HEAD cab5bd5, 2026-09-24) —
# сверка режимом сверки: harness/bot_kit_install.sh (CUSTOMER_REPO=<клон заказчика>) сравнивает каждую такую пару
# «путь + sha256» с живым файлом; retire с origin: kit_output сверяется с байтами origin_ref (git show).
#
# retire — файл снимается install.py layout, ТОЛЬКО если его sha256 == ожидаемому (печать диффа снятия); иной sha256 —
#   локальная правка заказчика: ИМЕНОВАННЫЙ конфликт (путь, ожидаемый и фактический SHA), файл не трогается.
#   Замена — РОВНО одно из двух полей (в манифест не идут): replaced_by_profile — id профиля, назначение читается
#   build_manifest.py из profiles/profiles.yaml (единственный адрес назначений профилей; второй таблицы путей нет);
#   replaced_by — путь назначения манифеста, не являющегося профилем. Без замены в манифесте retire не проецируется
#   (снимать инструкцию, не положив новую, установщик не должен).
#   origin — откуда отпечаток: customer_live — снят с живого репозитория заказчика (сверка CUSTOMER_REPO в
#   harness/bot_kit_install.sh); kit_output — байты выхода генератора на ревизии origin_ref «<ревизия>:<путь>» монорепо
#   (сверка там же через git show). Кроме этого отпечатка install.py layout принимает отпечаток последней раскладки
#   этого пути комплектом (kit-version.yaml managed) — так снимается любая выданная версия профиля, а правка
#   заказчика остаётся конфликтом.
# Каталог профилей переехал .workshop/ai/ → .workshop-ai/ (решение alex 2026-10-03, REQ-121; D02 «Комплект» п. 7):
#   прежние назначения четырёх профилей — retire с заменой тем же профилем на новом месте.
# supersedes — известное прежнее содержимое УПРАВЛЯЕМОГО назначения (роль managed), которое layout вправе перезаписать
#   (с диффом); иное содержимое, кроме последнего разложенного комплектом, — именованный конфликт.
